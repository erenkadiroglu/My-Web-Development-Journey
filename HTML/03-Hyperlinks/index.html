<!DOCTYPE html>
<html>
    <head>
        <title>Sekme Başlığı</title>
    </head>
    <body>
        <h1>HTML'de Linkler (Hyperlinks)</h1>
    
        <!-- target="_blank" tıklandığı zaman yeni sekmede açmaya yarıyor. -->  
        <!-- Linklere erişim için -->
        <a href="https://www.google.com"
        target="_blank"
        title="Google'a gitmek için tıklayın.">
        Google'a Git
        </a>

        <br><br>

        <!-- target="_self" tıklandığı zaman aynı sekmede açmaya yarıyor. -->
        <!-- Başka dosyaya erişim sağlamak için -->
        <a href="/02-Text-Formatting/index.html" 
        target="_self"
        title="Metin Biçimlendirme sayfasına gitmek için tıklayın.">
        Bir Önceki Konuya Git
        </a>

        <br><br>

        <!-- E-posta adresine erişim için -->
        <a href="mailto:example@example.com">
        E-posta Gönder
        </a>
    </body>
</html>
